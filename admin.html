<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr SMM Pannels - Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f6fb;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #6c2cff, #9b4dff);
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin-bottom: 8px;
    }

    .container {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .card h2 {
      color: #6c2cff;
      margin-bottom: 15px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #f5f1ff;
      color: #6c2cff;
    }

    .status {
      font-weight: bold;
    }

    .pending {
      color: #e67e22;
    }

    .success {
      color: #168321;
    }

    .failed {
      color: #c62828;
    }

    button {
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      background: #6c2cff;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #5520d8;
    }

    #message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <h1>🚀 Mr SMM Pannels</h1>
  <p>Admin Panel</p>
</header>

<div class="container">

  <div class="card">
    <h2>📊 Orders Management</h2>

    <button onclick="loadOrders()">🔄 Refresh Orders</button>

    <div id="message"></div>
  </div>

  <div class="card">
    <div class="table-wrap">

      <table>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Email</th>
            <th>Service</th>
            <th>Link</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Status</th>
            <th>Date</th>
          </tr>
        </thead>

        <tbody id="ordersTable">
          <tr>
            <td colspan="8">Loading orders...</td>
          </tr>
        </tbody>
      </table>

    </div>
  </div>

</div>

<footer>
  © 2026 Mr SMM Pannels — Admin Panel
</footer>

<script>

const SUPABASE_URL =
  "https://lgrdxyjbmzwhhnkfmups.supabase.co";

const SUPABASE_ANON_KEY =
  "PASTE_YOUR_SUPABASE_ANON_KEY_HERE";


async function loadOrders() {

  const table = document.getElementById("ordersTable");
  const message = document.getElementById("message");

  table.innerHTML =
    '<tr><td colspan="8">Loading orders...</td></tr>';

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/orders?select=*&order=created_at.desc",
      {
        method: "GET",

        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization":
            "Bearer " + SUPABASE_ANON_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error("Unable to load orders");
    }

    const orders = await response.json();

    if (orders.length === 0) {

      table.innerHTML =
        '<tr><td colspan="8">📋 No orders found.</td></tr>';

      return;
    }

    table.innerHTML = "";

    orders.forEach(order => {

      const row = document.createElement("tr");

      let statusClass = "pending";

      if (order.status === "Completed") {
        statusClass = "success";
      }

      if (order.status === "Failed") {
        statusClass = "failed";
      }

      row.innerHTML = `
        <td>${order.id ?? ""}</td>
        <td>${order.user_email ?? ""}</td>
        <td>${order.service ?? ""}</td>
        <td>
          <a href="${order.link ?? "#"}" target="_blank">
            Open Link
          </a>
        </td>
        <td>${order.quantity ?? ""}</td>
        <td>Rs ${order.price ?? "0"}</td>
        <td class="status ${statusClass}">
          ${order.status ?? "Pending"}
        </td>
        <td>
          ${order.created_at
            ? new Date(order.created_at).toLocaleString()
            : ""}
        </td>
      `;

      table.appendChild(row);

    });

  } catch (error) {

    table.innerHTML =
      '<tr><td colspan="8">❌ Could not load orders.</td></tr>';

    message.style.display = "block";
    message.style.background = "#ffecec";
    message.style.color = "#c62828";
    message.innerHTML =
      "⚠️ " + error.message;
  }
}

loadOrders();

</script>

</body>
</html>
