<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mr SMM Pannels - Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f6fb;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #6c2cff, #9b4dff);
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .box {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h2 {
      color: #6c2cff;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0 15px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #6c2cff;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #5520d8;
    }

    .logout {
      background: #d32f2f;
      margin-bottom: 20px;
    }

    .order {
      background: #f8f9ff;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 15px;
      border-left: 5px solid #6c2cff;
    }

    .order p {
      margin: 8px 0;
      word-break: break-word;
    }

    .status {
      font-weight: bold;
      color: #d97706;
    }

    .success {
      background: #e8f7e8;
      color: #168321;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
    }

    .error {
      background: #ffecec;
      color: #c62828;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
    }

    .hidden {
      display: none;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <h1>🚀 Mr SMM Pannels</h1>
  <p>Admin Panel</p>
</header>


<!-- ADMIN LOGIN -->

<div id="loginPage" class="container">

  <div class="box">

    <h2>🔐 Admin Login</h2>

    <input
      type="email"
      id="adminEmail"
      placeholder="Admin Email"
    >

    <input
      type="password"
      id="adminPassword"
      placeholder="Admin Password"
    >

    <button onclick="adminLogin()">
      🔐 Login as Admin
    </button>

    <div id="loginMessage"></div>

  </div>

</div>


<!-- ADMIN DASHBOARD -->

<div id="adminPanel" class="container hidden">

  <div class="box">

    <h2>📊 Admin Dashboard</h2>

    <p>
      Welcome to Mr SMM Pannels Admin Panel.
    </p>

    <br>

    <button onclick="loadOrders()">
      🔄 Refresh Orders
    </button>

    <br><br>

    <button class="logout" onclick="adminLogout()">
      🚪 Logout
    </button>

  </div>


  <div class="box">

    <h2>📋 All Orders</h2>

    <div id="ordersList">
      Loading orders...
    </div>

  </div>

</div>


<footer>
  © 2026 Mr SMM Pannels — Admin Panel
</footer>


<script type="module">

  import {
    createClient
  } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


  /* ================================
     SUPABASE CONFIG
  ================================= */

  const SUPABASE_URL =
    "https://lgrdxyjbmzwhhnkfmups.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_hKR1W0fX1e_3rAeGYJwDgg_yl9rtpmP";


  const supabase =
    createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* ================================
     ADMIN LOGIN
  ================================= */

  window.adminLogin = async function() {

    const email =
      document.getElementById("adminEmail").value.trim();

    const password =
      document.getElementById("adminPassword").value;

    const message =
      document.getElementById("loginMessage");


    if (!email || !password) {

      message.className = "error";

      message.innerText =
        "⚠️ Please enter email and password.";

      return;
    }


    try {

      const { data, error } =
        await supabase.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (error) {

        throw error;

      }


      message.className = "success";

      message.innerText =
        "✅ Admin login successful!";


      document
        .getElementById("loginPage")
        .classList.add("hidden");


      document
        .getElementById("adminPanel")
        .classList.remove("hidden");


      loadOrders();


    } catch (error) {

      message.className = "error";

      message.innerText =
        "❌ Login failed: " + error.message;

    }

  };


  /* ================================
     LOAD ORDERS
  ================================= */

  window.loadOrders = async function() {

    const list =
      document.getElementById("ordersList");


    list.innerHTML =
      "⏳ Loading orders...";


    try {

      const {
        data,
        error
      } = await supabase

        .from("orders")

        .select("*")

        .order(
          "created_at",
          {
            ascending: false
          }
        );


      if (error) {

        throw error;

      }


      if (!data || data.length === 0) {

        list.innerHTML =
          "📋 No orders found.";

        return;

      }


      let html = "";


      data.forEach(order => {

        const date =
          order.created_at
          ? new Date(order.created_at)
              .toLocaleString()
          : "N/A";


        html += `

          <div class="order">

            <p>
              <b>🆔 Order ID:</b>
              ${order.id}
            </p>

            <p>
              <b>📧 Customer:</b>
              ${order.user_email || order.user_id || "N/A"}
            </p>

            <p>
              <b>📱 Service:</b>
              ${order.service || "N/A"}
            </p>

            <p>
              <b>🔗 Link:</b>
              <a
                href="${order.link || "#"}"
                target="_blank"
              >
                ${order.link || "N/A"}
              </a>
            </p>

            <p>
              <b>📊 Quantity:</b>
              ${order.quantity || 0}
            </p>

            <p>
              <b>💵 Price:</b>
              Rs ${Number(order.price || 0).toFixed(2)}
            </p>

            <p>
              <b>📌 Status:</b>
              <span class="status">
                ${order.status || "Pending"}
              </span>
            </p>

            <p>
              <b>🕒 Date:</b>
              ${date}
            </p>

          </div>

        `;

      });


      list.innerHTML = html;


    } catch (error) {

      list.innerHTML =
        "❌ Could not load orders: "
        + error.message;

    }

  };


  /* ================================
     LOGOUT
  ================================= */

  window.adminLogout = async function() {

    await supabase.auth.signOut();


    document
      .getElementById("adminPanel")
      .classList.add("hidden");


    document
      .getElementById("loginPage")
      .classList.remove("hidden");


    document
      .getElementById("loginMessage")
      .innerText = "";

  };


  /* ================================
     CHECK EXISTING SESSION
  ================================= */

  const {
    data: {
      session
    }
  } = await supabase.auth.getSession();


  if (session) {

    document
      .getElementById("loginPage")
      .classList.add("hidden");


    document
      .getElementById("adminPanel")
      .classList.remove("hidden");


    loadOrders();

  }

</script>

</body>
</html>
