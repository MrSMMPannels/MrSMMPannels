<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr SMM Pannels - Admin</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f3f6fb;
  color: #222;
}

header {
  background: linear-gradient(135deg, #6c2cff, #9b4dff);
  color: white;
  padding: 25px;
  text-align: center;
}

header h1 {
  margin-bottom: 8px;
}

.container {
  max-width: 1200px;
  margin: 25px auto;
  padding: 0 15px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  margin-bottom: 25px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.card h3 {
  color: #6c2cff;
  margin-bottom: 10px;
}

.card p {
  font-size: 25px;
  font-weight: bold;
}

.orders {
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  overflow-x: auto;
}

.orders h2 {
  color: #6c2cff;
  margin-bottom: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 800px;
}

th,
td {
  padding: 12px;
  border-bottom: 1px solid #eee;
  text-align: left;
}

th {
  background: #f5f1ff;
  color: #6c2cff;
}

select {
  padding: 8px;
  border: 1px solid #ddd;
  border-radius: 7px;
}

button {
  padding: 9px 14px;
  border: none;
  border-radius: 7px;
  background: #6c2cff;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #5520d8;
}

.empty {
  padding: 20px;
  text-align: center;
  color: #777;
}

footer {
  text-align: center;
  padding: 25px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <h1>🔐 Mr SMM Pannels</h1>
  <p>Admin Dashboard</p>
</header>

<div class="container">

  <div class="cards">

    <div class="card">
      <h3>📋 Total Orders</h3>
      <p id="totalOrders">0</p>
    </div>

    <div class="card">
      <h3>⏳ Pending</h3>
      <p id="pendingOrders">0</p>
    </div>

    <div class="card">
      <h3>⚙️ Processing</h3>
      <p id="processingOrders">0</p>
    </div>

    <div class="card">
      <h3>✅ Completed</h3>
      <p id="completedOrders">0</p>
    </div>

  </div>

  <div class="orders">

    <h2>📋 Customer Orders</h2>

    <div id="ordersArea"></div>

  </div>

</div>

<footer>
  © 2026 Mr SMM Pannels — Admin Panel
</footer>

<script>

function loadOrders() {

  const orders = JSON.parse(
    localStorage.getItem("orders") || "[]"
  );

  document.getElementById("totalOrders").textContent =
    orders.length;

  document.getElementById("pendingOrders").textContent =
    orders.filter(o => o.status === "Pending").length;

  document.getElementById("processingOrders").textContent =
    orders.filter(o => o.status === "Processing").length;

  document.getElementById("completedOrders").textContent =
    orders.filter(o => o.status === "Completed").length;

  const area = document.getElementById("ordersArea");

  if (orders.length === 0) {
    area.innerHTML =
      '<div class="empty">📋 No orders found yet.</div>';
    return;
  }

  let html = `
    <table>
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Service</th>
          <th>Link</th>
          <th>Quantity</th>
          <th>Price</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
  `;

  orders.forEach((order, index) => {

    html += `
      <tr>

        <td>${order.id || "N/A"}</td>

        <td>${order.service || "N/A"}</td>

        <td>
          <a href="${order.link || "#"}"
             target="_blank">
             Open Link
          </a>
        </td>

        <td>${order.quantity || 0}</td>

        <td>Rs ${order.price || 0}</td>

        <td>
          <select id="status-${index}">
            <option ${order.status === "Pending" ? "selected" : ""}>
              Pending
            </option>

            <option ${order.status === "Processing" ? "selected" : ""}>
              Processing
            </option>

            <option ${order.status === "Completed" ? "selected" : ""}>
              Completed
            </option>

            <option ${order.status === "Cancelled" ? "selected" : ""}>
              Cancelled
            </option>
          </select>
        </td>

        <td>
          <button onclick="updateStatus(${index})">
            Save
          </button>
        </td>

      </tr>
    `;
  });

  html += `
      </tbody>
    </table>
  `;

  area.innerHTML = html;
}

function updateStatus(index) {

  const orders = JSON.parse(
    localStorage.getItem("orders") || "[]"
  );

  const newStatus =
    document.getElementById("status-" + index).value;

  orders[index].status = newStatus;

  localStorage.setItem(
    "orders",
    JSON.stringify(orders)
  );

  alert("✅ Order status updated!");

  loadOrders();
}

loadOrders();

</script>

</body>
</html>
