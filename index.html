<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr SMM Pannels</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f3f6fb;color:#222}
header{background:linear-gradient(135deg,#6c2cff,#9b4dff);color:white;padding:22px;text-align:center}
header h1{font-size:30px;margin-bottom:8px}
nav{margin-top:15px}
nav a{color:white;text-decoration:none;margin:0 10px;font-weight:bold}
.container{max-width:900px;margin:25px auto;padding:15px}
.card{background:white;padding:25px;border-radius:15px;margin-bottom:20px;box-shadow:0 4px 15px rgba(0,0,0,.08)}
h2{color:#6c2cff;margin-bottom:15px}
label{display:block;font-weight:bold;margin:12px 0 6px}
select,input{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px}
.price{background:#f1eaff;padding:15px;border-radius:10px;margin-top:15px;font-size:18px;font-weight:bold}
button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:9px;background:#6c2cff;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:hover{background:#5520d8}
.message{display:none;margin-top:15px;padding:12px;border-radius:9px}
footer{text-align:center;padding:25px;color:#777}
</style>
</head>

<body>

<header>
<h1>🚀 Mr SMM Pannels</h1>
<p>Social Media Marketing Services</p>

<nav>
<a href="#">🏠 Dashboard</a>
<a href="#order">🛒 New Order</a>
<a href="#">📋 My Orders</a>
<a href="#">🚪 Logout</a>
</nav>
</header>

<div class="container">

<div class="card">
<h2>💰 Your Balance</h2>
<h1>Rs 0.00</h1>
<p style="margin-top:8px">Welcome to Mr SMM Pannels!</p>
</div>

<div class="card" id="order">
<h2>🛒 New Order</h2>

<label>📱 Select Service</label>

<select id="service" onchange="calculatePrice()">

<option value="Instagram Likes">Instagram Likes — Rs 200 / 1,000</option>
<option value="Instagram Followers">Instagram Followers — Rs 500 / 1,000</option>
<option value="Instagram Views">Instagram Views — Rs 100 / 1,000</option>
<option value="Instagram Comments">Instagram Comments — Rs 300 / 1,000</option>

<option value="TikTok Likes">TikTok Likes — Rs 200 / 1,000</option>
<option value="TikTok Followers">TikTok Followers — Rs 500 / 1,000</option>
<option value="TikTok Views">TikTok Views — Rs 100 / 1,000</option>
<option value="TikTok Shares">TikTok Shares — Rs 150 / 1,000</option>

<option value="YouTube Views">YouTube Views — Rs 300 / 1,000</option>
<option value="YouTube Likes">YouTube Likes — Rs 400 / 1,000</option>
<option value="YouTube Subscribers">YouTube Subscribers — Rs 800 / 1,000</option>
<option value="YouTube Comments">YouTube Comments — Rs 500 / 1,000</option>

<option value="Facebook Likes">Facebook Likes — Rs 200 / 1,000</option>
<option value="Facebook Followers">Facebook Followers — Rs 500 / 1,000</option>
<option value="Facebook Page Likes">Facebook Page Likes — Rs 500 / 1,000</option>
<option value="Facebook Comments">Facebook Comments — Rs 300 / 1,000</option>

<option value="Telegram Members">Telegram Members — Rs 600 / 1,000</option>
<option value="Telegram Views">Telegram Views — Rs 100 / 1,000</option>
<option value="Telegram Reactions">Telegram Reactions — Rs 200 / 1,000</option>

<option value="Comments">Comments — Rs 300 / 1,000</option>

</select>

<label>🔗 Post / Profile Link</label>
<input type="url" id="link" placeholder="https://...">

<label>📊 Quantity</label>
<input type="number" id="quantity" min="1" placeholder="Example: 1000" oninput="calculatePrice()">

<div class="price">
💵 Total Price: <span id="total">Rs 0.00</span>
</div>

<button onclick="placeOrder()">🚀 Place Order</button>

<div class="message" id="message"></div>

</div>

</div>

<footer>
© 2026 Mr SMM Pannels — All Rights Reserved
</footer>

<script>

const prices = {
"Instagram Likes":200,
"Instagram Followers":500,
"Instagram Views":100,
"Instagram Comments":300,

"TikTok Likes":200,
"TikTok Followers":500,
"TikTok Views":100,
"TikTok Shares":150,

"YouTube Views":300,
"YouTube Likes":400,
"YouTube Subscribers":800,
"YouTube Comments":500,

"Facebook Likes":200,
"Facebook Followers":500,
"Facebook Page Likes":500,
"Facebook Comments":300,

"Telegram Members":600,
"Telegram Views":100,
"Telegram Reactions":200,

"Comments":300
};

function calculatePrice(){

const service=document.getElementById("service").value;
const quantity=Number(document.getElementById("quantity").value)||0;

const pricePer1000=prices[service];
const total=(quantity/1000)*pricePer1000;

document.getElementById("total").innerText=
"Rs "+total.toFixed(2);

}

function placeOrder(){

const link=document.getElementById("link").value;
const quantity=document.getElementById("quantity").value;
const service=document.getElementById("service").value;
const message=document.getElementById("message");

if(link==="" || quantity===""){
message.style.display="block";
message.style.background="#ffecec";
message.style.color="#c62828";
message.innerHTML="⚠️ Please enter the link and quantity.";
return;
}

message.style.display="block";
message.style.background="#e8f7e8";
message.style.color="#168321";

message.innerHTML=
"✅ Order received!<br><br>"+
"Service: "+service+"<br>"+
"Quantity: "+quantity+"<br>"+
"Total: "+document.getElementById("total").innerText;

}

</script>

</body>
</html>
